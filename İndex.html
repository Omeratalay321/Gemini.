<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Benim Gemini Botum</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; }
        #chat-box { width: 400px; height: 500px; border: 1px solid #ccc; overflow-y: auto; background: white; padding: 10px; margin-top: 20px; border-radius: 10px; }
        .input-area { margin-top: 10px; display: flex; width: 400px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; margin-left: 5px; }
    </style>
</head>
<body>

    <h2>Gardaş Sohbet Botu</h2>
    <div id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Bir şey yaz gardaş...">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        const API_KEY = 'BURAYA_KENDI_API_KEYINI_YAPISTIR';

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            if(!input.value) return;

            chatBox.innerHTML += `<p><strong>Sen:</strong> ${input.value}</p>`;
            
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: input.value }] }] })
            });

            const data = await response.json();
            const botReply = data.candidates[0].content.parts[0].text;
            
            chatBox.innerHTML += `<p><strong>Bot:</strong> ${botReply}</p>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
